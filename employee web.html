<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Project Management</title>

    <link rel="stylesheet" href="employee web1.css">
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="welcome-section">
            <div class="welcome-content">
                <h1>ProjectHub</h1>

                <h2>Employee Project Management</h2>

                <p>
                    Manage your projects, post updates and keep your
                    team informed — all in one place.
                </p>

                <div class="features">
                    <div>✓ Track project progress</div>
                    <div>✓ Post project updates</div>
                    <div>✓ Team collaboration</div>
                </div>
            </div>
        </div>


        <!-- Right Side -->
        <div class="login-section">

            <div class="login-box">

                <h2>Welcome Back 👋</h2>

                <p class="login-subtitle">
                    Login to your account
                </p>


                <!-- Role Selection -->
                <div class="role-selection">

                    <button
                        class="role-btn active"
                        id="employeeBtn"
                        onclick="selectRole('employee')">
                        Employee
                    </button>

                    <button
                        class="role-btn"
                        id="leaderBtn"
                        onclick="selectRole('leader')">
                        Team Leader
                    </button>

                </div>


                <!-- Login Form -->
                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                onclick="togglePassword()"
                                class="show-password">
                                👁
                            </button>

                        </div>

                    </div>


                    <div class="login-options">

                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>
<!--    

                      <button
                        type="submit"
                        class="login-btn"
                         onclick="window.location.href='employeeweb22.html'">

                    </button>
                -->
                    <a href="employeeweb22.html" class="login-btn">
    Login
</a>

                </form>

                <p id="message"></p>

            </div>

        </div>

    </div>


    <script src="employee web2.js"></script>

</body>

</html>
